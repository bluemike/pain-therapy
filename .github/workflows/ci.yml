name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: pain_therapy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/pain_therapy_test
      DATABASE_URL: postgresql://app:app@localhost:5432/pain_therapy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check .
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-only-secret-0123456789abcdef

  e2e:
    name: End-to-end, accessibility, screenshots
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: pain_therapy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CI: 'true'
      DATABASE_URL: postgresql://app:app@localhost:5432/pain_therapy
      AUTH_SECRET: ci-e2e-only-secret-0123456789abcdef
      AUTH_URL: http://localhost:3000
      AUTH_DEV_LOGIN: 'true'
      STORAGE_DRIVER: local
      MAIL_DRIVER: outbox
      MAIL_RETRY_DELAY_MS: '200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run catalog:sync
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pain-therapy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bicep:
    name: Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install && az bicep build --file infra/main.bicep --stdout > /dev/null
