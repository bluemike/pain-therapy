# Builds the image, runs the database migration job and rolls out a new Container App revision.
# Needs the one-time setup in docs/deployment.md (resource group, first Bicep deployment, OIDC federation,
# GitHub environment "production"). Runs only when the repository variable AZURE_DEPLOY_ENABLED is "true".
# Since iteration 4 it builds two images (practice app and patient zone) with the same tag and needs the GitHub
# secret PATIENT_ZONE_DB_PASSWORD (docs/deployment.md, "Iteration 4").
# Iteration 12 (practices, pain-therapy.online): no Entra and no Graph any more; needs the GitHub secrets
# PRACTICE_APP_DB_PASSWORD, AUTH_ENCRYPTION_KEY and SMTP_PASSWORD and the variables DOMAIN_MODE and ZONE_DOMAIN_MODE
# (docs/deployment.md, "Iteration 12").
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DOMAIN_MODE == 'bind' && 'https://pain-therapy.online' || 'https://pain-therapy.ayanta.ch' }}
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      # Fails before anything is built or changed in Azure
      - name: Check required secrets
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          PATIENT_ZONE_DB_PASSWORD: ${{ secrets.PATIENT_ZONE_DB_PASSWORD }}
          PRACTICE_APP_DB_PASSWORD: ${{ secrets.PRACTICE_APP_DB_PASSWORD }}
          AUTH_ENCRYPTION_KEY: ${{ secrets.AUTH_ENCRYPTION_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          missing=0
          need() {
            if [ -z "${!1}" ]; then
              echo "::error title=Missing secret::The GitHub secret $1 (environment \"production\") is not set. $2 See docs/deployment.md."
              missing=1
            fi
          }
          need AUTH_SECRET "Signs the session cookies."
          need POSTGRES_ADMIN_PASSWORD "Password of the database owner."
          need PATIENT_ZONE_DB_PASSWORD "Password of the database role patient_zone (section \"Iteration 4\")."
          need PRACTICE_APP_DB_PASSWORD "Password of the database role practice_app: openssl rand -base64 32 | tr -d '/+=' (section \"Iteration 12\")."
          need AUTH_ENCRYPTION_KEY "Key of the authenticator secrets: openssl rand -base64 32; never change it later (section \"Iteration 12\")."
          need SMTP_PASSWORD "Device password of noreply@pain-therapy.online at Infomaniak (section \"Iteration 12\")."
          exit $missing

      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read resource names
        id: names
        run: |
          out=$(az deployment group show -g "$RG" -n main --query properties.outputs -o json)
          echo "registry=$(jq -r .registryName.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "loginServer=$(jq -r .registryLoginServer.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "job=$(jq -r .migrateJobName.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "app=$(jq -r .appName.value <<<"$out")" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        run: |
          az acr login --name "${{ steps.names.outputs.registry }}"
          image="${{ steps.names.outputs.loginServer }}/pain-therapy:$IMAGE_TAG"
          docker build -t "$image" .
          docker push "$image"
          # Patient zone: built from the repository root (npm workspaces), same tag
          zone="${{ steps.names.outputs.loginServer }}/pain-therapy-zone:$IMAGE_TAG"
          docker build -f apps/patient-zone/Dockerfile -t "$zone" .
          docker push "$zone"

      # Before the first deployment of iteration 4 or 12 only: the migration job does not yet have the password of a
      # database role it creates (patient_zone, practice_app). Bicep runs once with the images that are live now: it adds
      # the Key Vault secrets and the passwords for the migration job. Since iteration 12 this also switches the live app
      # to the new settings, so the app is unavailable until the new revision below is up (a few minutes; see
      # docs/deployment.md, "Iteration 12"). Later runs skip this step.
      - name: Prepare new database roles (first deployment only)
        env:
          CUSTOM_DOMAIN_MODE: ${{ vars.CUSTOM_DOMAIN_MODE || 'off' }}
          ZONE_CUSTOM_DOMAIN_MODE: ${{ vars.ZONE_CUSTOM_DOMAIN_MODE || 'off' }}
          DOMAIN_MODE: ${{ vars.DOMAIN_MODE || 'off' }}
          ZONE_DOMAIN_MODE: ${{ vars.ZONE_DOMAIN_MODE || 'off' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          PATIENT_ZONE_DB_PASSWORD: ${{ secrets.PATIENT_ZONE_DB_PASSWORD }}
          PRACTICE_APP_DB_PASSWORD: ${{ secrets.PRACTICE_APP_DB_PASSWORD }}
          AUTH_ENCRYPTION_KEY: ${{ secrets.AUTH_ENCRYPTION_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          job="${{ steps.names.outputs.job }}"
          envs=$(az containerapp job show -g "$RG" -n "$job" --query "properties.template.containers[0].env[].name" -o tsv)
          if grep -qx PATIENT_ZONE_DB_PASSWORD <<<"$envs" && grep -qx PRACTICE_APP_DB_PASSWORD <<<"$envs"; then
            echo "Migration job already has the passwords of all database roles; nothing to prepare"
            exit 0
          fi
          tag_of() {
            img=$(az containerapp show -g "$RG" -n "$1" --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
            case "$img" in
              */$2:*) echo "${img##*:}" ;;
              *) echo "" ;;
            esac
          }
          export IMAGE_TAG=$(tag_of "${{ steps.names.outputs.app }}" pain-therapy)
          export ZONE_IMAGE_TAG=$(tag_of "$(az deployment group show -g "$RG" -n main --query properties.outputs.zoneAppName.value -o tsv)" pain-therapy-zone)
          echo "Preparing with the live image tags '$IMAGE_TAG' and '$ZONE_IMAGE_TAG'"
          az deployment group create -g "$RG" -n main -f infra/main.bicep -p infra/main.bicepparam -o none

      # prisma/migrate.sh: `prisma migrate deploy`, the roles patient_zone and practice_app with their grants, then the catalog.
      # Runs once per deployment, with the practice image; the patient zone never runs migrations.
      - name: Run database migrations and catalog sync
        run: |
          job="${{ steps.names.outputs.job }}"
          az containerapp job update -g "$RG" -n "$job" \
            --image "${{ steps.names.outputs.loginServer }}/pain-therapy:$IMAGE_TAG" \
            --command sh prisma/migrate.sh -o none
          execution=$(az containerapp job start -g "$RG" -n "$job" --query name -o tsv)
          for i in $(seq 1 60); do
            status=$(az containerapp job execution show -g "$RG" -n "$job" --job-execution-name "$execution" --query properties.status -o tsv)
            echo "Migration $execution: $status"
            [ "$status" = "Succeeded" ] && exit 0
            [ "$status" = "Failed" ] && exit 1
            sleep 10
          done
          echo "Migration did not finish in time" && exit 1

      - name: Deploy infrastructure and new revision
        env:
          CUSTOM_DOMAIN_MODE: ${{ vars.CUSTOM_DOMAIN_MODE || 'off' }}
          ZONE_CUSTOM_DOMAIN_MODE: ${{ vars.ZONE_CUSTOM_DOMAIN_MODE || 'off' }}
          DOMAIN_MODE: ${{ vars.DOMAIN_MODE || 'off' }}
          ZONE_DOMAIN_MODE: ${{ vars.ZONE_DOMAIN_MODE || 'off' }}
          ZONE_IMAGE_TAG: ${{ github.sha }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          PATIENT_ZONE_DB_PASSWORD: ${{ secrets.PATIENT_ZONE_DB_PASSWORD }}
          PRACTICE_APP_DB_PASSWORD: ${{ secrets.PRACTICE_APP_DB_PASSWORD }}
          AUTH_ENCRYPTION_KEY: ${{ secrets.AUTH_ENCRYPTION_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          az deployment group create -g "$RG" -n main -f infra/main.bicep -p infra/main.bicepparam -o none

      - name: Smoke test
        run: |
          out=$(az deployment group show -g "$RG" -n main --query properties.outputs -o json)
          check() {
            for i in $(seq 1 30); do
              curl -fsS "https://$2/api/health" && echo " ($1)" && return 0
              sleep 10
            done
            echo "::error::$1 is not healthy at https://$2/api/health"
            return 1
          }
          check "practice app" "$(jq -r .appFqdn.value <<<"$out")"
                    check "patient zone" "$(jq -r .zoneFqdn.value <<<"$out")"
