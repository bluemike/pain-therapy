# Builds the image, runs the database migration job and rolls out a new Container App revision.
# Needs the one-time setup in docs/deployment.md (resource group, first Bicep deployment, OIDC federation,
# GitHub environment "production"). Runs only when the repository variable AZURE_DEPLOY_ENABLED is "true".
# Since iteration 4 it builds two images (practice app and patient zone) with the same tag and needs the GitHub
# secret PATIENT_ZONE_DB_PASSWORD (docs/deployment.md, "Iteration 4").
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pain-therapy.ayanta.ch
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      # Fails before anything is built or changed in Azure
      - name: Check required secrets
        env:
          PATIENT_ZONE_DB_PASSWORD: ${{ secrets.PATIENT_ZONE_DB_PASSWORD }}
        run: |
          if [ -z "$PATIENT_ZONE_DB_PASSWORD" ]; then
            echo "::error title=Missing secret::The GitHub secret PATIENT_ZONE_DB_PASSWORD (environment \"production\") is not set. It is the password of the database role patient_zone of the patient zone. Create it before deploying: openssl rand -base64 32 | tr -d '/+=' ; see docs/deployment.md, section \"Iteration 4\"."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read resource names
        id: names
        run: |
          out=$(az deployment group show -g "$RG" -n main --query properties.outputs -o json)
          echo "registry=$(jq -r .registryName.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "loginServer=$(jq -r .registryLoginServer.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "job=$(jq -r .migrateJobName.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "app=$(jq -r .appName.value <<<"$out")" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        run: |
          az acr login --name "${{ steps.names.outputs.registry }}"
          image="${{ steps.names.outputs.loginServer }}/pain-therapy:$IMAGE_TAG"
          docker build -t "$image" .
          docker push "$image"
          # Patient zone: built from the repository root (npm workspaces), same tag
          zone="${{ steps.names.outputs.loginServer }}/pain-therapy-zone:$IMAGE_TAG"
          docker build -f apps/patient-zone/Dockerfile -t "$zone" .
          docker push "$zone"

      # One time only (first deployment of iteration 4): the migration job does not yet have the password of the role
      # patient_zone. Bicep runs once with the image that is live now and without the zone image: it adds the Key Vault
      # secrets, the identity of the zone, the password for the migration job and a placeholder zone app. The running
      # practice app keeps its image. Later runs skip this step.
      - name: Prepare the patient zone (first deployment only)
        env:
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          MAIL_SENDER: ${{ vars.MAIL_SENDER }}
          CUSTOM_DOMAIN_MODE: ${{ vars.CUSTOM_DOMAIN_MODE || 'off' }}
          ZONE_CUSTOM_DOMAIN_MODE: 'off'
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          PATIENT_ZONE_DB_PASSWORD: ${{ secrets.PATIENT_ZONE_DB_PASSWORD }}
        run: |
          job="${{ steps.names.outputs.job }}"
          has=$(az containerapp job show -g "$RG" -n "$job" \
            --query "length(properties.template.containers[0].env[?name=='PATIENT_ZONE_DB_PASSWORD'])" -o tsv)
          if [ "${has:-0}" != "0" ]; then
            echo "Migration job already has PATIENT_ZONE_DB_PASSWORD; nothing to prepare"
            exit 0
          fi
          live=$(az containerapp show -g "$RG" -n "${{ steps.names.outputs.app }}" \
            --query "properties.template.containers[0].image" -o tsv)
          case "$live" in
            */pain-therapy:*) export IMAGE_TAG="${live##*:}" ;;
            *) export IMAGE_TAG="" ;;
          esac
          export ZONE_IMAGE_TAG=""
          echo "Preparing the patient zone with the live image tag '$IMAGE_TAG'"
          az deployment group create -g "$RG" -n main -f infra/main.bicep -p infra/main.bicepparam -o none

      # prisma/migrate.sh: `prisma migrate deploy`, the role patient_zone with its grants, then the therapy catalog.
      # Runs once per deployment, with the practice image; the patient zone never runs migrations.
      - name: Run database migrations and catalog sync
        run: |
          job="${{ steps.names.outputs.job }}"
          az containerapp job update -g "$RG" -n "$job" \
            --image "${{ steps.names.outputs.loginServer }}/pain-therapy:$IMAGE_TAG" \
            --command sh prisma/migrate.sh -o none
          execution=$(az containerapp job start -g "$RG" -n "$job" --query name -o tsv)
          for i in $(seq 1 60); do
            status=$(az containerapp job execution show -g "$RG" -n "$job" --job-execution-name "$execution" --query properties.status -o tsv)
            echo "Migration $execution: $status"
            [ "$status" = "Succeeded" ] && exit 0
            [ "$status" = "Failed" ] && exit 1
            sleep 10
          done
          echo "Migration did not finish in time" && exit 1

      - name: Deploy infrastructure and new revision
        env:
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          MAIL_SENDER: ${{ vars.MAIL_SENDER }}
          CUSTOM_DOMAIN_MODE: ${{ vars.CUSTOM_DOMAIN_MODE || 'off' }}
          ZONE_CUSTOM_DOMAIN_MODE: ${{ vars.ZONE_CUSTOM_DOMAIN_MODE || 'off' }}
          ZONE_IMAGE_TAG: ${{ github.sha }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          PATIENT_ZONE_DB_PASSWORD: ${{ secrets.PATIENT_ZONE_DB_PASSWORD }}
        run: |
          az deployment group create -g "$RG" -n main -f infra/main.bicep -p infra/main.bicepparam -o none

      - name: Smoke test
        run: |
          out=$(az deployment group show -g "$RG" -n main --query properties.outputs -o json)
          check() {
            for i in $(seq 1 30); do
              curl -fsS "https://$2/api/health" && echo " ($1)" && return 0
              sleep 10
            done
            echo "::error::$1 is not healthy at https://$2/api/health"
            return 1
          }
          check "practice app" "$(jq -r .appFqdn.value <<<"$out")"
          # The zone scales to zero; the first request also covers its cold start
          check "patient zone" "$(jq -r .zoneFqdn.value <<<"$out")"
